server {
    listen 80;
    server_name witcha.dusit.ac.th;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name witcha.dusit.ac.th;
    ssl_certificate /etc/letsencrypt/live/witcha.dusit.ac.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witcha.dusit.ac.th/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    location = /75hour { return 308 /75hour/; }
    location /75hour/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
